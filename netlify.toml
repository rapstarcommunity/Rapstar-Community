functionsDirectory = "/opt/build/repo/netlify/functions"
functionsDirectoryOrigin = "config"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "/opt/build/repo"
publishOrigin = "config"
functions = "/opt/build/repo/netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[database]

  [database.migrations]
  path = "/opt/build/repo/netlify/database/migrations"

[functions]

  [functions."*"]
  node_bundler = "esbuild"

[[headers]]
for = "/admin/*"

  [headers.values]
  Cache-Control = "no-store"
  Referrer-Policy = "no-referrer"
  X-Frame-Options = "DENY"

[[redirects]]
from = "/db/*"
to = "/404.html"
status = 404
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/netlify/*"
to = "/404.html"
status = 404
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]