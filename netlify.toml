functionsDirectory = "netlify/functions"
functionsDirectoryOrigin = "config"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
# Use a dedicated output directory instead of the checkout's absolute path.
command = "node scripts/prepare-publish.cjs"
publish = "dist"
publishOrigin = "config"
functions = "netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[database]

  [database.migrations]
  path = "netlify/database/migrations"

[functions]

  [functions."*"]
  node_bundler = "esbuild"

[[headers]]
for = "/admin/*"

  [headers.values]
  Cache-Control = "no-store"
  Referrer-Policy = "no-referrer"
  X-Frame-Options = "DENY"

[[redirects]]
from = "/db/*"
to = "/404.html"
status = 404
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/netlify/*"
to = "/404.html"
status = 404
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]
