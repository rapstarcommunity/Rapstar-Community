    footer {

    .dropdown {

      transition-duration: 1s;

    }

    header {

    .container {

    @keyframes fadeIn {

    .music-section {
      background-color: #212121;
      padding: 50px;

      border-radius: 15px;

      color: white;

    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 30px;
      margin: 0;
      transition: 1s;
      font-family: 'Commons DemiBold', sans-serif;
    }

    h2:hover{
      transition: 1s;
      cursor: pointer;
      color: #c28310;
    }

    .show-all {
      font-family: 'Commons DemiBold', sans-serif;
      font-size: 14px;
      color: #c28310;
      text-decoration: none;
      transition: 1s;
    }

    .show-all:hover, .show-all:focus-visible {
      text-decoration: underline;
      color: #c28310;
      transition: 1s;
    }

    .music-list {
      display: flex;
      gap: 40px;
    }

    .music-item {
      width: 195px;
      padding-left: 15px;
    }

    .music-item img {
      width: 100%;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .music-item h3 {
      font-family: 'Commons DemiBold', sans-serif;
      font-size: 20px;
      margin: 10px 0 5px;
      transition: 1s;
    }

    .music-item p {
      font-family: 'Commons Regular', sans-serif;
      font-size: 16px;
      color: #b3b3b3;
      margin: 0;
      transition: 1s;
    }

    .music-item h3:hover, .music-item p:hover{
      cursor: pointer;
      color: #c28310;
      transition: 1s;
    }

    .highlight-section {
      background-color: #212121;
      padding: 50px;
      border-radius: 15px;
      margin-top: 30px;
    }

    .highlight-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .highlight-item {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      height: 50px;
      width: 48%;
      padding-right: 10px;
      line-height: 17px;
      display: flex;
      align-items: center;
      background-color: #333;
      border-radius: 4px;
      color: #fff;
      transition: background-color 0.3s ease;
      cursor: pointer;
      overflow: hidden;
      gap: 10px;
      box-sizing: border-box;
    }

    .highlight-item img {
      width: 50px;
      height: 50px;
      border-radius: 4px 0px 0px 4px;
      margin-right: 10px;
    }

    .highlight-item span {
      font-family: 'Commons DemiBold', sans-serif;
      font-size: 16px;
      color: #fff;
      transition: 1s;
    }

    .highlight-item span:hover{
      color: #c28310;
      transition: 1s;
    }

    .highlight-item:hover {
      background-color: #3a3a3a;
    }

    .label-section {
      background-color: #212121;
      padding: 40px;
      border-radius: 15px;
      margin-top: 30px;
    }

    .label-item {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #333;
      border-radius: 50%;
      transition: transform 0.3s ease;
      margin-right: 30px;
      margin-bottom: 20px;
    }

    .label-item img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    .label-item:hover {
      transform: scale(1.1);
      cursor: pointer;
      z-index: 999;
    }

    .label-item::after {
      content: attr(data-label-name);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      cursor: pointer;
    }

    .label-item:hover::after {
      opacity: 1;
      cursor: pointer;
    }

    .highlight-item a {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .news-container { margin-top: 0; padding-top: 20px; padding-bottom: 0; }
    .news-section { background: #212121; padding: 40px 50px; border-radius: 15px; width: 95%; margin: 0 auto; }
    .news-section[hidden] { display: none; }
    .news-controls { display: flex; gap: 10px; align-items: center; }
    .news-controls button { border: 1px solid #777; border-radius: 50%; width: 40px; height: 40px; background: #333; color: #fff; font-size: 22px; cursor: pointer; }
    .news-controls button:hover { background: #c28310; color: #1c1b19; }
    .news-controls button:focus-visible, .news-pagination button:focus-visible, .news-card:focus-visible { outline: 3px solid #c28310; outline-offset: 4px; }
    .news-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 8px; }
    .news-track::-webkit-scrollbar { display: none; }
    .news-slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
    .news-card { position: relative; display: block; height: 360px; overflow: hidden; color: #fff; }
    .news-card img { width: 100%; height: 100%; object-fit: cover; }
    .news-caption { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 32px; background: linear-gradient(transparent, rgba(28,27,25,.95)); }
    .news-kicker { color: #e8b558; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; margin-bottom: 10px; }
    .news-caption h3 { font-family: 'Commons DemiBold', sans-serif; font-size: clamp(22px, 3vw, 34px); line-height: 1.15; max-width: 720px; margin: 0; }
    .news-pagination { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
    .news-pagination button { border: 0; background: transparent; padding: 10px; cursor: pointer; }
    .news-pagination button::after { content: ''; display: block; width: 9px; height: 9px; background: #777; border-radius: 50%; }
    .news-pagination button[aria-current="true"]::after { background: #c28310; }
    #newsCounter { font-variant-numeric: tabular-nums; font-size: 14px; color: #b3b3b3; }
    .music-section { margin-bottom: 0; }
    .news-container + .container { margin-top: 0; padding-top: 20px; }
    @media (max-width: 600px) {
      .news-container { padding: 20px 15px 0; }
      .news-section { width: 100%; padding: 24px 18px; }
      .news-section .header h2 { font-size: 26px; }
      .news-card { height: 320px; }
      .news-caption { padding: 22px; }
      #newsCounter { display: none; }
    }
  </style>
